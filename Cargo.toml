[workspace]
resolver = "3"
members = ["crates/api"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/mydkonline/laughgg"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "migrate", "chrono", "rust_decimal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum-extra = { version = "0.10", features = ["cookie"] }
# 비밀번호는 Argon2id 로 만든다. 2026 기준 OWASP 권장이며 GPU 공격에 강하다.
argon2 = "0.5"
rand = "0.9"
# 구글 토큰 교환과 Stripe 호출. 서버끼리만 쓰므로 rustls 로 충분하다.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Stripe webhook 서명 검증
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
urlencoding = "2"
# 쿠키 만료 지정. axum-extra 의 cookie 가 이 타입을 쓴다.
time = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
module_name_repetitions = "allow"
