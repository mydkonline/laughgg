services:
  postgres:
    image: postgres:16
    container_name: laughgg-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: laughgg
      POSTGRES_PASSWORD: laughgg
      POSTGRES_DB: laughgg
    ports: ["5432:5432"]
    volumes: ["laughgg-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laughgg"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  laughgg-pg:
