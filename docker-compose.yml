services:
  mysql:
    image: mysql:8.4
    container_name: indygg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: indygg
      MYSQL_USER: indygg
      MYSQL_PASSWORD: indygg
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports: ["3306:3306"]
    volumes: ["indygg-mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  indygg-mysql:
