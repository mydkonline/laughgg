<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaughGG — 게임 에셋 마켓</title>
    <script>
      /* 첫 페인트 전에 테마를 확정한다. 기본은 다크다. */
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("igg-theme"); } catch (e) {}
        document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
