<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaughGG — 게임 에셋 마켓</title>
    <script>
      /* 첫 페인트 전에 테마를 확정한다. 기본은 다크다. */
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("igg-theme"); } catch (e) {}
        document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
      })();

      /* lang 도 첫 페인트 전에 맞춘다.

         읽어 주는 프로그램과 검색 로봇이 이 값을 보고 어느 말인지 정한다.
         "ko" 로 둔 채 영어를 띄우면 한국어 발음으로 영어를 읽는다.
         언어는 주소 첫 칸이 정한다 — lib/locale 과 같은 규칙이고,
         기본 언어(한국어)는 주소에 안 붙어서 여기 안 걸린다. */
      (function () {
        var head = location.pathname.split("/").filter(Boolean)[0];
        if (head === "laughgg") head = location.pathname.split("/").filter(Boolean)[1];
        if (head === "en") document.documentElement.lang = "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
