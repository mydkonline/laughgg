<style>
  :root {
    --bg: #121216; --panel: #191920; --panel2: #20202a; --line: #2e2e3a;
    --ink: #EBEBEF; --muted: #9AA4AF; --faint: #6E6E7C;
    --accent: #5383E8; --navy: #28344E; --pass: #3FBF8F; --warn: #F0B457;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: Roboto, system-ui, -apple-system, "Apple SD Gothic Neo", Pretendard, sans-serif;
    font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .m { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { background: var(--navy); height: 50px; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
  header .lg { display: flex; align-items: center; gap: 7px; color: #fff; font-weight: 900; font-size: 15px; letter-spacing: -.03em; }
  header .lg i { width: 14px; height: 14px; border: 3px solid #fff; border-radius: 50%; display: block; }
  header .ttl { color: #C3CBD1; font-size: 12.5px; }
  header .sp { margin-left: auto; }
  header a { color: #C3CBD1; text-decoration: none; font-size: 12px; padding: 5px 11px; border: 1px solid rgba(255,255,255,.22); border-radius: 4px; }
  header a:hover { color: #fff; border-color: #fff; }

  .wrap { display: grid; grid-template-columns: 232px minmax(0,1fr) 176px; gap: 12px; padding: 12px; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } }

  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 13px;
    display: flex; flex-direction: column; gap: 14px; align-self: start; }
  .grp { display: flex; flex-direction: column; gap: 6px; }
  .grp > .m { color: var(--faint); }
  .hint { color: var(--faint); font-size: 11px; line-height: 1.5; margin: 0; }

  .styles { display: flex; flex-direction: column; gap: 4px; }
  .sb { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 5px;
    border: 1px solid var(--line); color: var(--muted); text-align: left; font-size: 12px; }
  .sb:hover { border-color: var(--accent); color: var(--ink); }
  .sb[aria-pressed="true"] { border-color: var(--accent); background: rgba(83,131,232,.14); color: var(--accent); font-weight: 700; }
  .dimlab { color: var(--accent); padding: 8px 2px 3px; border-bottom: 1px solid var(--line); margin-bottom: 3px; }
  .dimlab:first-child { padding-top: 0; }
  .sb i { width: 11px; height: 11px; border-radius: 2px; background: var(--sw); flex: none; }
  .sb small { display: block; color: var(--faint); font-weight: 400; font-size: 10px; }

  .field { width: 100%; padding: 7px 10px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 3px; background: var(--panel2); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 2px solid var(--panel); cursor: grab; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row output { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 12px; }

  .stage { position: relative; background: #08080c; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #cv { display: block; width: 100%; height: auto; cursor: grab; }
  #cv.drag { cursor: grabbing; }
  .bar2 { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .bar2 .sp { margin-left: auto; }
  .btn { padding: 7px 14px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.p { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 650; }

  .tray { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .tb { aspect-ratio: 1; border-radius: 5px; border: 1px solid var(--line); background: var(--panel2);
    display: grid; place-items: center; padding: 5px; position: relative; }
  .tb:hover { border-color: var(--accent); }
  .tb[aria-pressed="true"] { border-color: var(--accent); background: rgba(83,131,232,.16); }
  .tb img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .placed { display: flex; flex-direction: column; gap: 4px; max-height: 190px; overflow-y: auto; }
  .pl { display: flex; align-items: center; gap: 7px; padding: 5px 7px; border-radius: 4px; border: 1px solid var(--line); font-size: 11.5px; }
  .pl[aria-pressed="true"] { border-color: var(--accent); background: rgba(83,131,232,.12); }
  .pl img { width: 20px; height: 20px; object-fit: contain; }
  .pl b { flex: 1; font-weight: 500; }
  .pl button { color: var(--faint); font-size: 13px; line-height: 1; }
  .pl button:hover { color: var(--fail, #e8556a); }
</style>

  /* 눌리는 느낌 — 전 페이지 공통. transform 이 아니라 scale 프로퍼티라 기존 transform 과 안 싸운다 */
  @media (prefers-reduced-motion: no-preference) {
    button, .btn, .igg-ghost, .igg-cta, .igg-tabs a, [role="button"] {
      transition: scale .16s cubic-bezier(.22,1,.36,1),
                  background-color .16s ease, color .16s ease, border-color .16s ease;
    }
    button:active, .btn:active, .igg-ghost:active, .igg-cta:active,
    .igg-tabs a:active, [role="button"]:active { scale: .97; }
    .igg-cta:hover { scale: 1.03; }
  }
  :where(a, button, input, select, textarea):focus-visible {
    outline: 2px solid var(--igg-blue); outline-offset: 2px;
  }
</style>

<script>
(function () {
  var b = document.getElementById("theme");
  if (!b) return;
  b.addEventListener("click", function () {
    var r = document.documentElement, c = r.getAttribute("data-theme");
    var dark = c ? c === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
    r.setAttribute("data-theme", dark ? "light" : "dark");
  });
})();
</script>

function buildTray() {

  $$("#tray .tb").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.k === pick));
    b.onclick = () => { pick = b.dataset.k; $$("#tray .tb").forEach(o => o.setAttribute("aria-pressed", String(o === b))); };

}

$("#r-rot").oninput = e => { if (items[sel]) { items[sel].r = +e.target.value; $("#o-rot").value = e.target.value + "°"; draw(); } };

/* ── 배치 ── */
const cv = $("#cv");
const rel = ev => { const r = cv.getBoundingClientRect(); return [(ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height]; };
const hit = (px2, py2) => {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i], im = IMGS[it.key]; if (!im || !im.width) continue;
    const w = (im.width * it.s * .34) / cv.width, h = (im.height * it.s * .34) / cv.height;
    if (Math.abs(px2 - it.x) < w / 2 && Math.abs(py2 - it.y) < h / 2) return i;
  }
  return -1;
};
cv.addEventListener("pointerdown", ev => {
  const [px2, py2] = rel(ev); const i = hit(px2, py2);
  if (i >= 0) { sel = i; dragging = true; dragOff = [px2 - items[i].x, py2 - items[i].y]; cv.classList.add("drag"); cv.setPointerCapture(ev.pointerId); }
  else { items.push({ key: pick, x: px2, y: py2, s: 1, r: 0 }); sel = items.length - 1; }
  renderPlaced(); syncSel(); draw();
});
cv.addEventListener("pointermove", ev => {
  if (!dragging || !items[sel]) return;
  const [px2, py2] = rel(ev); items[sel].x = px2 - dragOff[0]; items[sel].y = py2 - dragOff[1]; draw();
});
cv.addEventListener("pointerup", () => { dragging = false; cv.classList.remove("drag"); });

function syncSel() {
  const it = items[sel]; if (!it) return;
  $("#r-sz").value = it.s * 100; $("#o-sz").value = Math.round(it.s * 100) + "%";
  $("#r-rot").value = it.r; $("#o-rot").value = it.r + "°";
}
function renderPlaced() {
  $("#placed").innerHTML = items.map((it, i) =>
    `<div class="pl" data-i="${i}" ${i === sel ? 'aria-pressed="true"' : ""}>
      <img src="${A}${it.key}${ext(it.key)}" alt=""><b>${NAMES[it.key] || it.key}</b><button data-del="${i}">✕</button></div>`
  ).join("") || `<span class="hint">아직 없습니다</span>`;
  $$("#placed .pl").forEach(el2 => {
    el2.onclick = ev => { if (ev.target.dataset.del) return; sel = +el2.dataset.i; renderPlaced(); syncSel(); draw(); };
  });
  $$("#placed [data-del]").forEach(b => b.onclick = ev => {
    ev.stopPropagation(); items.splice(+b.dataset.del, 1); sel = Math.min(sel, items.length - 1); renderPlaced(); syncSel(); draw();
  });
}

/* ── 렌더 ── */
const off = document.createElement("canvas");
const tintCache = {};
function bgTint(key) {                        // 배경 평균색 → 에셋에 얹을 조명색
  if (tintCache[key]) return tintCache[key];
  const im = IMGS[key]; if (!im || !im.width) return [255, 255, 255];
  const t = document.createElement("canvas"); t.width = 24; t.height = 14;
  const tx = t.getContext("2d"); tx.drawImage(im, 0, 0, 24, 14);
  const d = tx.getImageData(0, 0, 24, 14).data;
  let r = 0, g = 0, b2 = 0;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b2 += d[i + 2]; }
  const n = d.length / 4;
  return tintCache[key] = [r / n, g / n, b2 / n];
}

function draw() {
  const W = cv.width, H = cv.height;
  const isShot = !bgKey.startsWith("dk");
  const k = isShot ? .30 : 1;
  const g0 = cur.grade;
  const g = { br: 1 + (g0.br - 1) * k, ct: 1 + (g0.ct - 1) * k, sat: 1 + (g0.sat - 1) * k,
              hue: g0.hue * k, sep: g0.sep * k };
  const pxs = isShot ? Math.max(.06, userRes) : Math.max(.06, cur.px * userRes);
  const rw = Math.max(64, Math.round(W * pxs)), rh = Math.max(36, Math.round(H * pxs));
  off.width = rw; off.height = rh;
  const x = off.getContext("2d");
  x.save(); x.scale(rw / W, rh / H);

  const bg = IMGS[bgKey];
  x.filter = `brightness(${g.br}) contrast(${g.ct}) saturate(${g.sat}) hue-rotate(${g.hue}deg) sepia(${g.sep})`;
  if (bg && bg.width) {
    const sc = Math.max(W / bg.width, H / bg.height);
    x.drawImage(bg, (W - bg.width * sc) / 2, (H - bg.height * sc) / 2, bg.width * sc, bg.height * sc);
  } else { x.fillStyle = "#101018"; x.fillRect(0, 0, W, H); }
  x.filter = "none";

  if (cur.teal) {
    x.save(); x.globalCompositeOperation = "multiply"; x.globalAlpha = cur.teal * (isShot ? .5 : 1);
    const tg = x.createLinearGradient(0, 0, 0, H);
    tg.addColorStop(0, "rgba(160,200,215,1)"); tg.addColorStop(1, "rgba(225,200,170,1)");
    x.fillStyle = tg; x.fillRect(0, 0, W, H); x.restore();
  }
  const F = cur.fogC, fa = userFog * .55 * (isShot ? .34 : 1);
  x.fillStyle = `rgba(${F[0]},${F[1]},${F[2]},${fa})`; x.fillRect(0, 0, W, H);

  /* 에셋 — 배경 평균색으로 물들여 붙게 만듭니다 */
  const T = bgTint(bgKey);
  items.forEach((it, i) => {
    const im = IMGS[it.key]; if (!im || !im.width) return;
    const w = im.width * it.s * .34, h = im.height * it.s * .34;
    x.save();
    x.translate(it.x * W, it.y * H); x.rotate(it.r * Math.PI / 180);
    x.save(); x.globalAlpha = .40; x.filter = "blur(6px)";
    x.fillStyle = "#000"; x.beginPath(); x.ellipse(0, h * .40, w * .30, h * .075, 0, 0, 7); x.fill(); x.restore();
    x.filter = `brightness(${(g.br * .5 + .5) * (.85 + userLit * .25)}) contrast(${g.ct}) saturate(${g.sat * 1.04}) hue-rotate(${g.hue * .7}deg)`;
    x.drawImage(im, -w / 2, -h / 2, w, h);
    x.filter = "none";
    // 배경색 물들이기
    x.save(); x.globalCompositeOperation = "source-atop"; x.globalAlpha = .26;
    x.fillStyle = `rgb(${T[0] | 0},${T[1] | 0},${T[2] | 0})`;
    x.fillRect(-w / 2, -h / 2, w, h); x.restore();
    if (i === sel) {
      x.strokeStyle = "rgba(83,131,232,.9)"; x.lineWidth = 2; x.setLineDash([6, 4]);
      x.strokeRect(-w / 2, -h / 2, w, h); x.setLineDash([]);
    }
    x.restore();
  });

  x.save(); x.globalCompositeOperation = "lighter";
  cur.light.forEach(L => {
    const rg = x.createRadialGradient(L.x * W, L.y * H, 4, L.x * W, L.y * H, L.r * Math.max(W, H) * .6);
    const ii = L.i * userLit * (isShot ? .55 : 1);
    rg.addColorStop(0, `rgba(${L.c[0]},${L.c[1]},${L.c[2]},${ii})`);
    rg.addColorStop(.42, `rgba(${L.c[0]},${L.c[1]},${L.c[2]},${ii * .28})`);
    rg.addColorStop(1, `rgba(${L.c[0]},${L.c[1]},${L.c[2]},0)`);
    x.fillStyle = rg; x.fillRect(0, 0, W, H);
  });
  x.restore();

  const vg = x.createRadialGradient(W / 2, H * .52, H * .22, W / 2, H * .52, H * 1.05);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, `rgba(0,0,0,${cur.vig * (isShot ? .55 : 1)})`);
  x.fillStyle = vg; x.fillRect(0, 0, W, H);

  if (cur.grain > 0) for (let i = 0; i < 700; i++)
    { x.fillStyle = `rgba(255,255,255,${Math.random() * cur.grain})`; x.fillRect(Math.random() * W, Math.random() * H, 1.4, 1.4); }
  x.restore();

  const c = cv.getContext("2d");
  c.imageSmoothingEnabled = pxs > .5;
  c.clearRect(0, 0, W, H);
  c.drawImage(off, 0, 0, rw, rh, 0, 0, W, H);

  $("#stat").textContent = `${cur.n} · ${POOLS[cur.pool].n} · 배치 ${items.length}개${isShot ? " · 공식 스크린샷" : " · CC0 대체"}`;
}

})();
</script>
