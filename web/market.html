
<script id="igg-theme-boot">
/* 기본은 다크다. 저장된 선택이 OS 설정보다 우선한다. */
(function () {
  var saved = null;
  try { saved = localStorage.getItem("igg-theme"); } catch (e) {}
  document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
})();
</script>

window.buildGallery = async function (p) {
  const main = document.getElementById("galimg");
  const rail = document.getElementById("galthumbs");
  if (!main || !rail) return;

  if (!p.m) {                       /* 도트 상품은 파일 하나뿐이다 */
    main.src = `./assets/${p.img}.png`;
    main.className = "dot";
    rail.innerHTML = "";
    return;
  }
  const VIEWS = [
    { k: "3/4", dir: [0.62, 0.42, 0.86], mat: null },
    { k: "정면", dir: [0, 0.12, 1],      mat: null },
    { k: "위",   dir: [0.3, 1.1, 0.45],  mat: null },
    { k: "면",   dir: [0.62, 0.42, 0.86], mat: "wire" },
  ];
  rail.innerHTML = VIEWS.map((v, i) =>
    `<button type="button" data-i="${i}" aria-pressed="${i === 0}" title="${v.k}"><img alt="${v.k}"></button>`).join("");
  const imgs = [...rail.querySelectorAll("img")];
  for (let i = 0; i < VIEWS.length; i++) {
    try {
      const url = await window.bakeView(p.m, VIEWS[i].dir, VIEWS[i].mat);
      imgs[i].src = url;
      if (i === 0) { main.src = url; main.className = ""; }
    } catch (e) { imgs[i].closest("button").remove(); }
  }
  /* 마지막 칸은 정지 이미지가 아니라 실제로 도는 화면이다 */
  rail.insertAdjacentHTML("beforeend",
    '<button type="button" data-spin title="회전 시연"><span class="spinlbl">회전 시연</span></button>');
  const spin = document.getElementById("galspin");

  rail.onclick = e => {
    const b = e.target.closest("button");
    if (!b) return;
    rail.querySelectorAll("button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    if (b.hasAttribute("data-spin")) {
      main.hidden = true; spin.hidden = false;
      window.startSpin && window.startSpin(p.m, spin);
    } else {
      window.stopSpin && window.stopSpin();
      spin.hidden = true; main.hidden = false;
      main.src = b.querySelector("img").src;
    }
  };
};

  const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  r.setSize(W, H);
  r.setPixelRatio(Math.min(devicePixelRatio, 2));
  r.outputColorSpace = THREE.SRGBColorSpace;
  r.toneMapping = THREE.ACESFilmicToneMapping;
  r.toneMappingExposure = 1.05;

  const sc = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(r);
  await new Promise(done => {
    new HDRLoader().load("./assets/ph/studio_1k.hdr", tex => {
      tex.mapping = THREE.EquirectangularReflectionMapping;
      sc.environment = pmrem.fromEquirectangular(tex).texture;
      tex.dispose(); done();
    }, undefined, () => { sc.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture; done(); });
  });
  const key = new THREE.DirectionalLight(0xffffff, 1.25);
  key.position.set(0.8, 1.2, 0.9);
  sc.add(key);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
  const loader = new GLTFLoader();
  const cache = new Map();

  function fit(node) {
    const sph = new THREE.Box3().setFromObject(node).getBoundingSphere(new THREE.Sphere());
    return sph;
  }

  /* 각도와 재질을 바꿔 굽는다 — 상세 갤러리가 쓴다 */
  window.bakeView = async function (id, dir, mat) {
    const key = id + "|" + dir.join(",") + "|" + (mat || "");
    if (cache.has(key)) return cache.get(key);
    const g = await new Promise((ok, no) =>
      loader.load(`./assets/ph/${id}/${id}_1k.gltf`, ok, undefined, no));
    const o = g.scene, bb = new THREE.Box3().setFromObject(o);
    const sz = new THREE.Vector3(), ct = new THREE.Vector3();
    bb.getSize(sz); bb.getCenter(ct);
    o.position.set(-ct.x, -ct.y, -ct.z);
    o.traverse(x => {
      if (!x.isMesh) return;
      if (mat === "wire") x.material = new THREE.MeshBasicMaterial({ color: 0x7d59ea, wireframe: true });
      else x.material.envMapIntensity = 1.1;
    });
    const n = new THREE.Group(); n.add(o);
    n.scale.setScalar(1 / Math.max(sz.x, sz.y, sz.z, 1e-6));
    sc.add(n);
    const sph = fit(n);
    const fov = cam.fov * Math.PI / 180;
    const dist = (sph.radius / Math.sin(fov / 2)) * 1.04;
    cam.position.copy(sph.center).addScaledVector(new THREE.Vector3(...dir).normalize(), dist);
    cam.near = Math.max(dist - sph.radius * 2, 0.01);
    cam.far = dist + sph.radius * 4;
    cam.updateProjectionMatrix();
    cam.lookAt(sph.center);
    r.render(sc, cam);
    const url = r.domElement.toDataURL("image/png");
    sc.remove(n);
    cache.set(key, url);
    return url;
  };


  /* 회전 시연 — 영상 파일을 만들 수 없으니 실제 모델을 그 자리에서 돌린다 */
  let spinR = null, spinRAF = 0;
  window.startSpin = async function (id, canvas) {
    window.stopSpin();
    if (!spinR) {
      spinR = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      spinR.outputColorSpace = THREE.SRGBColorSpace;
      spinR.toneMapping = THREE.ACESFilmicToneMapping;
      spinR.toneMappingExposure = 1.05;
    } else {
      spinR.dispose();
      spinR = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      spinR.outputColorSpace = THREE.SRGBColorSpace;
      spinR.toneMapping = THREE.ACESFilmicToneMapping;
      spinR.toneMappingExposure = 1.05;
    }
    spinR.setPixelRatio(Math.min(devicePixelRatio, 2));
    const s2 = new THREE.Scene();
    s2.environment = sc.environment;
    const k = new THREE.DirectionalLight(0xffffff, 1.2); k.position.set(0.8, 1.2, 0.9);
    s2.add(k);
    const g = await new Promise((ok, no) =>
      loader.load(`./assets/ph/${id}/${id}_1k.gltf`, ok, undefined, no));
    const o = g.scene, bb = new THREE.Box3().setFromObject(o);
    const sz = new THREE.Vector3(), ct = new THREE.Vector3();
    bb.getSize(sz); bb.getCenter(ct);
    o.position.set(-ct.x, -ct.y, -ct.z);
    o.traverse(x => { if (x.isMesh) x.material.envMapIntensity = 1.1; });
    const pivot = new THREE.Group(); pivot.add(o);
    pivot.scale.setScalar(1 / Math.max(sz.x, sz.y, sz.z, 1e-6));
    s2.add(pivot);
    const c2 = new THREE.PerspectiveCamera(30, 4 / 3, 0.01, 100);
    const sph = new THREE.Box3().setFromObject(pivot).getBoundingSphere(new THREE.Sphere());
    const dist = (sph.radius / Math.sin(c2.fov * Math.PI / 360)) * 1.1;
    c2.position.set(0, sph.center.y + sph.radius * 0.32, dist);
    c2.near = 0.01; c2.far = dist + sph.radius * 4;
    c2.updateProjectionMatrix();
    c2.lookAt(sph.center);
    let t = 0;
    (function loop() {
      spinRAF = requestAnimationFrame(loop);
      const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
      spinR.setSize(w, h, false);
      c2.aspect = w / h; c2.updateProjectionMatrix();
      t += 0.012;
      pivot.rotation.y = t;
      spinR.render(s2, c2);
    })();
  };
  window.stopSpin = function () { if (spinRAF) cancelAnimationFrame(spinRAF); spinRAF = 0; };

  async function bake(id) {
    if (cache.has(id)) return cache.get(id);
    const g = await new Promise((ok, no) =>
      loader.load(`./assets/ph/${id}/${id}_1k.gltf`, ok, undefined, no));
    const o = g.scene, bb = new THREE.Box3().setFromObject(o);
    const sz = new THREE.Vector3(), ct = new THREE.Vector3();
    bb.getSize(sz); bb.getCenter(ct);
    o.position.set(-ct.x, -ct.y, -ct.z);
    o.traverse(x => { if (x.isMesh) x.material.envMapIntensity = 1.1; });
    const n = new THREE.Group(); n.add(o);
    n.scale.setScalar(1 / Math.max(sz.x, sz.y, sz.z, 1e-6));
    n.rotation.y = -0.55;
    sc.add(n);

    /* 모델마다 비율이 달라 고정 거리로는 잘린다. 바운딩 스피어로 거리를 맞춘다. */
    const sph = new THREE.Box3().setFromObject(n).getBoundingSphere(new THREE.Sphere());
    const fov = cam.fov * Math.PI / 180;
    const dist = (sph.radius / Math.sin(fov / 2)) * 1.06;   /* 프레임의 8할을 채운다 */
    cam.position.copy(sph.center)
       .addScaledVector(new THREE.Vector3(0.6, 0.42, 0.86).normalize(), dist);
    cam.near = Math.max(dist - sph.radius * 2, 0.01);
    cam.far = dist + sph.radius * 4;
    cam.updateProjectionMatrix();
    cam.lookAt(sph.center);

    r.render(sc, cam);
    const url = r.domElement.toDataURL("image/png");
    sc.remove(n);
    cache.set(id, url);
    return url;
  }

  /* 그리드는 필터로 다시 그려지니 새로 붙은 것만 굽는다 */
  async function paint() {
    for (const img of document.querySelectorAll(".thumb[data-m]:not([data-done])")) {
      img.dataset.done = "1";
      try {
        img.src = await bake(img.dataset.m);
        img.classList.add("on");
      } catch (e) { img.remove(); }
    }
  }
  await paint();
  new MutationObserver(() => { paint(); })
    .observe(document.getElementById("grid"), { childList: true, subtree: true });
})();
</script>
