<meta charset="utf-8">
<title>LaughGG — 마켓</title>

<style>
  :root {
    --ground: #1C1C1F;
    --surface: #23232A;
    --surface-2: #2A2A33;
    --surface-3: #31313C;
    --line: #3A3A47;
    --line-soft: #27272E;
    --ink: #EBEBEF;
    --muted: #9AA4AF;
    --faint: #6E6E7C;
    --brass: #8FA6D6;
    --brass-dim: #3A5DA8;
    --brass-soft: rgba(83,131,232,.14);
    --common: #8A9098;
    --rare: #7D8A86;
    --epic: #8E93A0;
    --legend: #C0A472;
    --pass: #6E9C88;
    --fail: #B08088;
    --radius: 4px;
  }

  :root[data-theme="light"] {
    --ground: #F2F2F5;
    --surface: #FFFFFF;
    --surface-2: #F7F7FA;
    --surface-3: #EBEBF0;
    --line: #DCDCE3;
    --line-soft: #EAEAF0;
    --ink: #1F1F26;
    --muted: #5B6875;
    --faint: #8A93A0;
    --brass: #3F63A8;
    --brass-dim: #9BB6EE;
    --brass-soft: rgba(58,107,216,.1);
    --common: #6B727B;
    --rare: #4F6560;
    --epic: #5D6472;
    --legend: #8A6B2E;
    --pass: #3F7A63;
    --fail: #9E4A54;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground: #F2F2F5; --surface: #FFFFFF; --surface-2: #F7F7FA; --surface-3: #EBEBF0;
      --line: #DCDCE3; --line-soft: #EAEAF0; --ink: #1F1F26; --muted: #5B6875; --faint: #8A93A0;
      --brass: #3F63A8; --brass-dim: #9BB6EE; --brass-soft: rgba(58,107,216,.1);
      --common: #6B727B; --rare: #4F6560; --epic: #5D6472; --legend: #8A6B2E;
      --pass: #3F7A63; --fail: #9E4A54;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Apple SD Gothic Neo", Pretendard, sans-serif;
    font-size:16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .m {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size:16px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

  .shell { max-width: 1240px; margin: 0 auto; padding: 0 22px 80px; }

  /* ================= header ================= */
  header.top {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--ground) 92%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }

  .topin { max-width: 1240px; margin: 0 auto; padding: 0 22px; height: 58px; display: flex; align-items: center; gap: 22px; }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo .anv {
    width: 28px; height: 28px; border-radius: 5px; display: grid; place-items: center;
    background: var(--brass); color: #fff; font-weight: 800; font-size:16px; letter-spacing: -.03em;
  }
  .logo .wm { font-weight: 800; letter-spacing: .02em; font-size:16px; }
  .logo .wm small { display: block; font-size:16px; letter-spacing: .18em; color: var(--faint); font-weight: 600; }

  .tabs { display: flex; gap: 2px; }
  .tabs button {
    padding: 7px 13px; border-radius: 5px; color: var(--muted); font-size:16px;
  }
  .tabs button:hover { background: var(--surface-2); color: var(--ink); }
  .tabs button[aria-current="true"] { color: var(--brass); background: var(--brass-soft); font-weight: 650; }

  .spacer { margin-left: auto; }

  .iconbtn {
    display: flex; align-items: center; gap: 7px;
    padding: 6px 12px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted);
  }
  .iconbtn:hover { border-color: var(--brass); color: var(--brass); }
  .iconbtn .cnt {
    min-width: 17px; padding: 0 4px; border-radius: 9px; background: var(--brass);
    color: #fff; font-size:16px; font-weight: 800; text-align: center;
  }

  /* ================= masthead ================= */
  .mast {
    padding: 46px 0 30px;
    border-bottom: 1px solid var(--line);
    display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 40px; align-items: end;
  }
  @media (max-width: 860px) { .mast { grid-template-columns: 1fr; gap: 24px; } }

  .mast h1 {
    margin: 0 0 12px;
    font-size:clamp(32px,4.6vw,48px);
    line-height: 1.08; letter-spacing: -.03em; font-weight: 800;
    text-wrap: balance; max-width: 15ch;
  }
  .mast h1 em { font-style: normal; color: var(--brass); }
  .mast p { margin: 0; color: var(--muted); max-width: 46ch; }

  .livestats { display: flex; flex-direction: column; gap: 10px; }
  .lsrow { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft); }
  .lsrow .n { font-size:24px; font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .lsrow .l { color: var(--faint); }
  .lsrow .t { margin-left: auto; color: var(--pass); font-size:16px; font-variant-numeric: tabular-nums; }

  /* ================= layout ================= */
  .page { display: none; padding-top: 24px; }
  .page.on { display: block; }

  .market { display: grid; grid-template-columns: 196px minmax(0,1fr); gap: 26px; }
  @media (max-width: 900px) { .market { grid-template-columns: 1fr; } }

  aside.rail { display: flex; flex-direction: column; gap: 22px; align-self: start; position: sticky; top: 78px; }
  @media (max-width: 900px) { aside.rail { position: static; } }

  .rgroup { display: flex; flex-direction: column; gap: 7px; }
  .rgroup > .m { color: var(--faint); padding-bottom: 3px; border-bottom: 1px solid var(--line-soft); }

  .fbtn {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 5px 8px; border-radius: 4px; color: var(--muted); font-size:16px; text-align: left;
  }
  .fbtn:hover { background: var(--surface-2); color: var(--ink); }
  .fbtn[aria-pressed="true"] { color: var(--brass); background: var(--brass-soft); font-weight: 600; }
  .fbtn .c { margin-left: auto; color: var(--faint); font-size:16px; font-variant-numeric: tabular-nums; }

  .scorectl { display: flex; flex-direction: column; gap: 8px; }
  .scorectl .row { display: flex; justify-content: space-between; align-items: baseline; }
  .scorectl output { font-weight: 750; font-variant-numeric: tabular-nums; color: var(--brass); }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 4px; border-radius: 3px; background: var(--surface-3); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--brass); border: 2px solid var(--surface); cursor: grab;
  }
  input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--brass); border: 2px solid var(--surface); }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .search {
    flex: 1; min-width: 200px; padding: 9px 13px; border-radius: 5px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .search::placeholder { color: var(--faint); }
  .sortsel {
    padding: 9px 12px; border-radius: 5px; background: var(--surface);
    border: 1px solid var(--line); color: var(--muted); font-size:16px;
  }

  /* ================= piece cards ================= */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 16px; }

  .piece {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    overflow: hidden; text-align: left; display: flex; flex-direction: column;
    transition: transform .16s cubic-bezier(.2,.8,.2,1), border-color .16s;
    position: relative;
  }
  .piece:hover { transform: translateY(-2px); border-color: var(--rr, var(--brass)); }
  .piece[aria-pressed="true"] { border-color: var(--rr, var(--brass)); box-shadow: 0 0 0 1px var(--rr, var(--brass)); }

  .piece .art {
    aspect-ratio: 16/10; position: relative;
    background:
      radial-gradient(120% 90% at 50% 110%, color-mix(in srgb, var(--rr) 26%, transparent), transparent 68%),
      repeating-linear-gradient(45deg, var(--surface-2) 0 9px, var(--surface) 9px 18px);
    display: grid; place-items: center;
    border-bottom: 1px solid var(--line-soft);
  }
  .piece .art .gl { font-size:32px; filter: saturate(.85); }

  .seal {
    position: absolute; top: 8px; left: 8px;
    display: flex; align-items: center; gap: 5px;
    padding: 3px 8px; border-radius: 3px;
    background: color-mix(in srgb, var(--ground) 78%, transparent);
    border: 1px solid var(--rr); color: var(--rr);
    font-family: ui-monospace, Menlo, monospace; font-size:16px; letter-spacing: .07em; font-weight: 700;
  }

  .engbadge {
    position: absolute; bottom: 8px; right: 8px;
    display: flex; gap: 4px;
  }
  .engbadge span {
    padding: 2px 6px; border-radius: 3px; font-size:16px; letter-spacing: .06em;
    background: color-mix(in srgb, var(--ground) 78%, transparent);
    border: 1px solid var(--line); color: var(--muted);
    font-family: ui-monospace, Menlo, monospace;
  }

  .piece .info { padding: 11px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .piece .ttl { font-weight: 650; font-size:16px; letter-spacing: -.01em; line-height: 1.35; }
  .piece .by { color: var(--faint); font-size:16px; }
  .piece .foot { display: flex; align-items: baseline; gap: 8px; margin-top: auto; padding-top: 8px; }
  .piece .prc { font-weight: 750; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .piece .dl { margin-left: auto; color: var(--faint); font-size:16px; font-variant-numeric: tabular-nums; }

  .feelbar { display: flex; align-items: center; gap: 7px; }
  .feelbar .fb { flex: 1; height: 4px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .feelbar .fb b { display: block; height: 100%; background: var(--rr); }
  .feelbar .fl { color: var(--faint); font-size:16px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; }

  .empty { grid-column: 1/-1; padding: 56px; text-align: center; color: var(--faint); border: 1px dashed var(--line); border-radius: var(--radius); }




  /* 카드는 그림·배지·이름·가격만. 나머지는 열어서 본다 */
  .piece .art .gl { font-size: 48px; }
  .piece .seal { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center;
    gap: 5px; padding: 4px 9px; border-radius: 99px; background: rgba(10,10,12,.72);
    color: #fff; font-size: 10pt; font-weight: 800; backdrop-filter: blur(5px); }
  .piece .info { padding: 13px 14px 15px; display: flex; flex-direction: column; gap: 8px; }
  .piece .ttl { font-size: 12pt; font-weight: 700; line-height: 1.35; }
  .piece .foot { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
  .piece .eng2 { overflow: hidden; text-overflow: ellipsis; max-width: 52%; }
  .piece .prc { font-size: 12pt; font-weight: 800; }
  .piece .eng2 { margin-left: auto; color: var(--faint); font-size: 9pt; letter-spacing: .04em; }

  /* ── 네비 아래 고정 필터바 ── */
  .filterbar { position: sticky; top: 96px; z-index: 30; margin: 0 -20px 0;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: saturate(180%) blur(14px);
    border-bottom: 1px solid var(--line); }
  .fbin { max-width: 1240px; margin: 0 auto; padding: 10px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .fbq { flex: 1 1 300px; min-width: 200px; display: flex; align-items: center; gap: 8px;
    padding: 8px 13px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); }
  .fbq .i { opacity: .5; }
  .fbq input { flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: var(--ink); font-size: 11.5pt; font-family: inherit; }
  .fbs { display: flex; align-items: center; gap: 9px; flex: 0 1 320px; }
  .fbs .k { color: var(--faint); font-size: 10pt; white-space: nowrap; }
  .fbs input[type=range] { flex: 1; min-width: 110px; }
  .fbs output { font-weight: 800; min-width: 2.4ch; text-align: right; }
  .fbn { margin-left: auto; color: var(--faint); font-size: 10pt; white-space: nowrap; }
  .fbn b { color: var(--ink); font-weight: 800; }
  @media (max-width: 700px) { .filterbar { top: 88px; } .fbn { display: none; } }

  /* ── 디렉터리 레이아웃 ── */
  .market { display: block; }
  .dirhead { padding: 2px 0 18px; border-bottom: 1px solid var(--line); }
  .crumb { display: flex; gap: 8px; align-items: center; color: var(--faint); font-size:16px; }
  .crumb a:hover { color: var(--ink); }
  .crumb b { color: var(--ink); font-weight: 600; }
  .dirtag { margin: 18px 0 0; color: var(--brass); font-size:16px; font-weight: 700; letter-spacing: .04em; }
  .dirh { margin: 6px 0 0; font-size: 48px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .dirlede { margin: 12px 0 0; color: var(--muted); font-size:16px; max-width: 54ch; line-height: 1.6; }
  .dircounts { margin: 0; display: flex; gap: 34px; flex-wrap: wrap; }
  .dircounts b { display: block; font-size: 32px; font-weight: 800; letter-spacing: -.04em; line-height: 1.1; }
  .dircounts span { font-size:16px; color: var(--faint); }

  .filters { padding: 16px 0 4px; border-bottom: 0; display: flex;
    flex-direction: column; gap: 10px; }
  .frow { display: flex; align-items: center; gap: 12px; }
  .frow .fk { flex: 0 0 62px; color: var(--faint); font-size: 10pt; font-weight: 700; letter-spacing: .02em; }
  .fset { display: flex; gap: 6px; align-items: center; flex: 1; min-width: 0;
    flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
    scrollbar-width: none; scroll-snap-type: x proximity;
    padding: 2px 26px 2px 2px;
    /* 오른쪽 끝을 흐리게 해서 더 있다는 걸 알린다 */
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent);
            mask-image: linear-gradient(90deg, #000 calc(100% - 26px), transparent); }
  .fset::-webkit-scrollbar { display: none; }
  .fset.nosc { overflow: visible; -webkit-mask-image: none; mask-image: none; padding-right: 2px; }
  .fset > * { scroll-snap-align: start; }
  .fset .fbtn { width: auto; flex: none; white-space: nowrap; padding: 5px 11px; font-size: 11pt; border-radius: 99px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font-size:16px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: border-color .16s ease, color .16s ease, background-color .16s ease, scale .16s cubic-bezier(.22,1,.36,1); }
  .fset .fbtn:hover { border-color: var(--brass); color: var(--ink); }
  .fset .fbtn:active { scale: .96; }
  .fset .fbtn .c { margin-left: 0; color: var(--faint); font-size: 9.5pt; font-variant-numeric: tabular-nums; }
  .fset .fbtn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--ground); }
  .fset .fbtn[aria-pressed="true"] .c { color: var(--ground); opacity: .65; }
  .scorectl { gap: 12px; }
  .scorectl input[type=range] { flex: 0 1 230px; }
  .scorectl output { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2ch; }
  .filters .search { flex: 1 1 260px; min-width: 180px; }

  .reshead { display: flex; justify-content: flex-end; padding: 14px 0 12px; }
  .reshead h2 { margin: 0; font-size: 24px; font-weight: 750; letter-spacing: -.03em; }
  .rescount { color: var(--faint); font-size:16px; }
  .rescount b { color: var(--ink); font-weight: 700; }
  .resetb { margin-left: auto; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line);
    background: transparent; color: var(--muted); font-size: 10pt; cursor: pointer;
    transition: border-color .16s ease, color .16s ease, scale .16s cubic-bezier(.22,1,.36,1); }
  .resetb:hover { border-color: var(--brass); color: var(--ink); }
  .resetb:active { scale: .96; }

  .dirfoot { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .dirfoot .m { font-size:16px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
  .dirfoot .gk { display: flex; flex-direction: column; gap: 6px;
    font-size:16px; color: var(--muted); line-height: 1.5; }
  .dirfoot .gk b { display: inline-flex; align-items: center; gap: 5px; }
  .dirfoot .rk { width: 15px; height: 15px; }
  @media (max-width: 760px) {
    .dirfoot { grid-template-columns: 1fr; }
    .frow { flex-direction: column; align-items: flex-start; gap: 7px; }
    .frow .fk { flex: none; }
  }
  .empty .resetb { margin: 14px auto 0; display: inline-block; }

  /* ================= drawer ================= */
  .scrim {
    position: fixed; inset: 0; background: rgba(8,8,6,.6); z-index: 50;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
    background: var(--surface); border-left: 1px solid var(--line); z-index: 51;
    transform: translateX(102%); transition: transform .26s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .drawer.on { transform: none; }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }

  .dhead { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: flex-start; gap: 12px; }
  .dhead h2 { margin: 0 0 3px; font-size:16px; letter-spacing: -.02em; }
  .dhead .by { color: var(--faint); }
  .closeb { margin-left: auto; padding: 4px 9px; border-radius: 4px; color: var(--faint); border: 1px solid var(--line); }
  .closeb:hover { color: var(--ink); border-color: var(--muted); }

  .dbody { flex: 1; overflow-y: auto; padding: 18px 20px 26px; display: flex; flex-direction: column; gap: 20px; }

  .sect { display: flex; flex-direction: column; gap: 10px; }
  .sect > .m { color: var(--faint); padding-bottom: 5px; border-bottom: 1px solid var(--line-soft); }

  .vp {
    aspect-ratio: 16/9; border-radius: 5px; border: 1px solid var(--line);
    background:
      radial-gradient(120% 90% at 50% 110%, color-mix(in srgb, var(--rr) 22%, transparent), transparent 68%),
      repeating-linear-gradient(45deg, var(--surface-2) 0 9px, var(--surface) 9px 18px);
    display: grid; place-items: center; gap: 8px; color: var(--faint);
  }
  .vp .pl {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--rr); color: var(--rr); background: color-mix(in srgb, var(--rr) 12%, transparent);
  }

  .chk { display: flex; flex-direction: column; gap: 9px; }
  .ck { display: grid; grid-template-columns: 15px 1fr 92px 38px; gap: 10px; align-items: center; font-size:16px; }
  .ck .ic { text-align: center; font-size:16px; }
  .ck.p .ic { color: var(--pass); }
  .ck.f .ic { color: var(--fail); }
  .ck .nm { color: var(--muted); }
  .ck .bar { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .ck .bar b { display: block; height: 100%; }
  .ck .sc { text-align: right; font-variant-numeric: tabular-nums; font-weight: 650; font-size:16px; }

  .kv { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-size:16px; }
  .kv:last-child { border-bottom: 0; }
  .kv .k { color: var(--faint); }
  .kv .v { font-variant-numeric: tabular-nums; }

  pre.code {
    margin: 0; padding: 13px; border-radius: 5px; overflow-x: auto;
    background: var(--ground); border: 1px solid var(--line);
    font-family: ui-monospace, Menlo, monospace; font-size:16px; line-height: 1.7;
    color: var(--muted); white-space: pre; min-height: 96px;
  }
  pre.code .kw { color: var(--epic); }
  pre.code .st { color: var(--pass); }
  pre.code .cm { color: var(--faint); }
  pre.code .fn { color: var(--brass); }
  .caret { border-right: 2px solid var(--brass); animation: bl .9s steps(1) infinite; }
  @keyframes bl { 50% { border-color: transparent; } }
  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }

  .dfoot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; background: var(--surface-2); }
  .dfoot .p { font-size:16px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .buy {
    margin-left: auto; padding: 10px 20px; border-radius: 5px;
    background: var(--brass); color: #fff; font-weight: 750; font-size:16px;
  }
  .buy:hover { filter: brightness(1.07); }
  .ghostb { padding: 10px 15px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); font-size:16px; }
  .ghostb:hover { border-color: var(--brass); color: var(--brass); }

  /* ================= community ================= */
  .comm { display: grid; grid-template-columns: minmax(0,1fr) 292px; gap: 26px; }
  @media (max-width: 900px) { .comm { grid-template-columns: 1fr; } }

  .post {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px; display: flex; flex-direction: column; gap: 11px; margin-bottom: 14px;
  }
  .phead { display: flex; align-items: center; gap: 10px; }
  .ava {
    width: 32px; height: 32px; border-radius: 4px; flex: none;
    display: grid; place-items: center; font-weight: 800; font-size:16px; color: #16161C;
  }
  .phead .nm { font-weight: 650; font-size:16px; }
  .phead .sub { color: var(--faint); font-size:16px; }
  .ptag {
    margin-left: auto; padding: 2px 9px; border-radius: 20px; font-size:16px;
    border: 1px solid var(--line); color: var(--faint);
    font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em;
  }
  .ptag.wip { color: var(--rare); border-color: color-mix(in srgb, var(--rare) 50%, transparent); }
  .ptag.ask { color: var(--epic); border-color: color-mix(in srgb, var(--epic) 50%, transparent); }
  .ptag.ship { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 50%, transparent); }

  .pbody { font-size:16px; line-height: 1.6; }
  .pshot {
    aspect-ratio: 21/9; border-radius: 5px; border: 1px solid var(--line-soft);
    background: repeating-linear-gradient(45deg, var(--surface-2) 0 9px, var(--surface-3) 9px 18px);
    display: grid; place-items: center; color: var(--faint); font-size:24px;
  }
  .pacts { display: flex; gap: 6px; padding-top: 3px; }
  .pacts button {
    display: flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 4px;
    border: 1px solid var(--line); color: var(--faint); font-size:16px;
  }
  .pacts button:hover { border-color: var(--brass); color: var(--brass); }
  .pacts button[aria-pressed="true"] { color: var(--brass); border-color: var(--brass); background: var(--brass-soft); }

  .side { display: flex; flex-direction: column; gap: 16px; align-self: start; position: sticky; top: 78px; }
  @media (max-width: 900px) { .side { position: static; } }

  .box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .box h3 { margin: 0; padding: 11px 14px; border-bottom: 1px solid var(--line-soft); font-size:16px; font-weight: 650; display: flex; align-items: center; gap: 7px; }
  .box .pad { padding: 12px 14px; }

  .qrow { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--line-soft); font-size:16px; }
  .qrow:last-child { border-bottom: 0; }
  .qrow .st2 { margin-left: auto; font-family: ui-monospace, Menlo, monospace; font-size:16px; letter-spacing: .06em; }
  .spin { width: 11px; height: 11px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--brass); animation: sp .8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

  .lead { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--line-soft); font-size:16px; }
  .lead:last-child { border-bottom: 0; }
  .lead .rk { width: 16px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; font-size:16px; }
  .lead .amt { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); font-size:16px; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--surface-3); border: 1px solid var(--brass-dim); color: var(--ink);
    padding: 10px 18px; border-radius: 6px; font-size:16px; z-index: 60;
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .toast.on { transform: translateX(-50%) translateY(0); }

  .note { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--faint); max-width: 62ch; }
</style>

        btn.disabled = false; btn.textContent = "⚡ 다시 생성";
        toast("통합 코드 생성됨 — 충돌 0건");
        return;
      }
      box.innerHTML = lines.slice(0, i + 1).join("\n") + '<span class="caret"></span>';
      i++;
      setTimeout(step, 75);
    };
    step();
  }

  /* ---------- community ---------- */
  const AVCOL = ["--legend", "--rare", "--epic", "--pass"];
  const POSTS = [
    { by: "More Mountains", ini: "M", tag: "ship", tn: "출시", when: "2시간 전", sub: "Feel 4.3 업데이트",
      body: "MMFeedbacks에 시간 감속 곡선을 따로 뺐음. 사망 연출에서 히트스톱만으로는 부족하다는 피드백이 많았어서. 검수 게임 필 98점 — 이 마켓에서 아직 안 깨진 최고점임.", shot: "💥", likes: 412, cmt: 63 },
    { by: "익명 인디", ini: "익", tag: "ask", tn: "피드백", when: "5시간 전", sub: "Odin 살까 말까",
      body: "인스펙터 커스텀 짜는 데 시간을 너무 씀. Odin이 $55인데 세일 때 $27.50까지 떨어진다길래 기다리는 중임. 근데 매출 넘으면 엔터프라이즈 $250/seat 붙는다는 게 걸림. 나중에 갈아타기 힘들다는 얘기 진짜임?", shot: "🔧", likes: 186, cmt: 94 },
    { by: "도트찍는사람", ini: "도", tag: "wip", tn: "작업중", when: "어제", sub: "Aseprite → LDtk 파이프라인",
      body: "Aseprite에서 타일셋 뽑고 LDtk에서 규칙 기반으로 배치하는 흐름 정리했음. LDtk가 무료인데 데드셀 디렉터가 만든 거라 완성도가 이상할 정도로 높음. JSON으로 나와서 엔진 안 가림.", shot: "🗺", likes: 238, cmt: 41 },
    { by: "점프감각", ini: "점", tag: "ask", tn: "피드백", when: "어제", sub: "코요테 타임 기본값",
      body: "Corgi Engine 기본 코요테 타임이 관대하다는 얘기가 있는데, 셀레스테가 0.1초임. 처음 만드는 사람 기준이면 관대한 게 낫지 않음? 이런 감각 파라미터 기본값은 누가 정하는 게 맞는 건지 모르겠음.", shot: "🏃", likes: 157, cmt: 88 },
    { by: "사운드늦게함", ini: "사", tag: "ask", tn: "피드백", when: "3일 전", sub: "FMOD vs Wwise",
      body: "둘 다 인디 구간에선 무료인데 뭐부터 배워야 함? Wwise가 현장 점유율 높아서 이직에 낫다는 얘기랑, FMOD가 러닝커브 완만해서 게임 완성이 먼저라는 얘기가 갈림. 오디오를 맨 마지막에 미룬 게 후회됨.", shot: "🎚", likes: 94, cmt: 112 },
    { by: "3인팀", ini: "3", tag: "ship", tn: "출시", when: "5일 전", sub: "에셋비 총정산 공개",
      body: "3년 걸린 프로젝트 에셋비 다 합쳐서 $1,180 나옴. 제일 잘 쓴 돈은 Hot Reload($79.99) — 게임 필 튜닝을 수백 번 반복하는데 컴파일 대기가 사라지니까 체감이 달랐음. 제일 아까운 건 안 쓴 번들들.", shot: "⚡", likes: 521, cmt: 76 },
  ];

  let ff = "all";
  const renderFeed = () => {
    const f = $("#feed"); f.innerHTML = "";
    const list = POSTS.filter(p => ff === "all" || p.tag === ff);
    if (!list.length) { f.append(el("div", "empty", "이 분류에 글이 없음")); return; }
    list.forEach((p, i) => {
      const d = el("div", "post");
      d.innerHTML = `
        <div class="phead">
          <span class="ava" style="background:var(${AVCOL[i % AVCOL.length]})">${p.ini}</span>
          <span><span class="nm">${esc(p.by)}</span><br><span class="sub">${esc(p.sub)} · ${p.when}</span></span>
          <span class="ptag ${p.tag}">${p.tn}</span>
        </div>
        <div class="pbody">${esc(p.body)}</div>
        <div class="pshot">${p.shot}</div>
        <div class="pacts">
          <button data-a="like">▲ <span>${p.likes}</span></button>
          <button data-a="cmt">💬 ${p.cmt}</button>
          <button data-a="fork">⑂ 내 프로젝트로</button>
        </div>`;
      const lb = $('[data-a="like"]', d);
      lb.onclick = () => {
        const on = lb.getAttribute("aria-pressed") === "true";
        lb.setAttribute("aria-pressed", String(!on));
        $("span", lb).textContent = p.likes + (on ? 0 : 1);
      };
      $('[data-a="cmt"]', d).onclick = () => toast("댓글 " + p.cmt + "개 — 데모라 여기까지임");
      $('[data-a="fork"]', d).onclick = () => toast("내 프로젝트에 복사됨");
      f.append(d);
    });
  };

  $$("#ftabs button").forEach(b => b.onclick = () => {
    ff = b.dataset.f;
    $$("#ftabs button").forEach(o => o.setAttribute("aria-current", String(o === b)));
    renderFeed();
  });

  /* queue + leaderboard */
  const QUEUE = [
    ["Febucci / Text Animator 4.0", "게임 필 측정", 1], ["Kronnect / Voxel Play 4.2", "성능 검사", 1],
    ["Staggart / Stylized Water 3.1", "라이선스 추적", 1], ["Opsive / Behavior Designer 3.1", "대기 중", 0],
  ];
  $("#queue").append(...QUEUE.map(([n, s, run]) =>
    el("div", "qrow", `${run ? '<span class="spin"></span>' : '<span style="width:11px;color:var(--faint)">·</span>'}
      <span>${n}</span><span class="st2" style="color:var(--${run ? "brass" : "faint"})">${s}</span>`)));

  const BOARD = [["More Mountains", "97 · Feel"], ["Sirenix", "96 · Odin"], ["Aseprite", "95 · Igara"], ["A* Project", "94 · Granberg"], ["FMOD", "94 · Firelight"]];
  $("#board").append(...BOARD.map(([n, a], i) =>
    el("div", "lead", `<span class="rk">${i + 1}</span>
      <span class="ava" style="width:22px;height:22px;font-size:16px;background:var(${AVCOL[i % AVCOL.length]})">${n[0]}</span>
      <span>${n}</span><span class="amt">${a}</span>`)));

  render(); renderFeed(); syncCart();
})();
</script>
