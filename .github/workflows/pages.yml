name: Deploy Pages

on:
  push:
    branches: [main]
    # 앱과 배포 설정이 바뀔 때만 돈다. Rust 쪽 커밋으로 사이트를 다시 올릴 이유가 없다.
    paths:
      - "app/**"
      - "web/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치면 안 된다. 취소하지 않고 줄을 세운다 — 앞 배포가 반쯤 올라간 채로
# 끊기면 사이트가 섞인 상태로 남는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # app/public/assets 는 web/assets 로 가는 심링크인데 .gitignore 에 걸려
      # 있어 체크아웃에는 없다. 여기서 만들어 준다. 없어도 빌드는 통과하고
      # 이미지만 비므로, 만든 뒤에 실제로 파일이 보이는지까지 확인한다.
      - name: Link assets
        working-directory: app
        run: |
          ln -sfn ../../web/assets public/assets
          test -n "$(ls -A public/assets)"

      - name: Install
        working-directory: app
        run: npm ci

      # build 스크립트가 tsc -b 를 먼저 돌린다. 타입이 깨지면 여기서 멈춘다.
      - name: Build
        working-directory: app
        run: npm run build

      # Pages 는 없는 경로에 404.html 을 준다. 같은 SPA 를 넣어 두면
      # /indygg/ir 같은 직접 접속과 새로고침이 살아난다.
      - name: SPA fallback
        run: cp app/dist/index.html app/dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
